[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vkg-llm-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.129.0",
    "fiftyone>=1.7.0",
    "matplotlib>=3.10.3",
    "numpy>=2.3.1",
    "openai>=1.93.0",
    "openai-agents>=0.0.7",
    "pillow>=11.3.0",
    "pycocotools>=2.0.11",
    "pydantic>=2.11.7",
    "python-multipart>=0.0.22",
    "reportlab>=4.4.10",
    "requests>=2.32.4",
    "scikit-learn>=1.7.0",
    "selenium>=4.39.0",
    "torch>=2.7.1",
    "torchvision>=0.22.1",
    "tqdm>=4.67.1",
    "ultralytics>=8.4.14",
    "uvicorn>=0.41.0",
    "vision-utils",
]

# Console entry points (make files callable)
[project.scripts]
resnet-train = "cvmodellearning.examples.resnet_train:main"

[tool.uv]
package = true

[tool.uv.sources]
vision-utils = { git = "https://github.com/cqels/vision.git" }

# Tell setuptools to use the src/ layout
[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

# Include JSON data files inside the package wheel
[tool.setuptools.package-data]
cvmodellearning = [
  "download_utils/*.json",
]
